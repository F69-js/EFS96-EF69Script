<!DOCTYPE html>

    <style>
        body { font-family: 'Courier New', Courier, monospace; }

        .editor-container { position: relative; width: 100%; height: 100%; min-h-[300px]; }
        .editor-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            margin: 0; padding: 1rem; box-sizing: border-box;
            border: 1px solid #374151; border-radius: 0.375rem;
            font-size: 0.9rem; line-height: 1.6rem; overflow: auto;

            resize: none; z-index: 10;
        }
        #editor-highlight { background: #111827; z-index: 5; pointer-events: none; }
        
        .hl-comment { color: #6a9955; font-style: italic; }   
        .hl-keyword { color: #4ba3e3; font-weight: bold; }    
        .hl-system { color: #ee6666; font-weight: bold; }

        .hl-builtin { color: #c0a9df; }                      
        .hl-operator { color: #ffffff; font-weight: bold; }

        .hl-ident { color: #e5e7eb; }                          
        .hl-defined-var { color: #fef08a; font-weight: 500; } 


        .brace-depth-0 { color: #f472b6; font-weight: bold; } 
        .brace-depth-1 { color: #fbbf24; font-weight: bold; }
        .brace-depth-2 { color: #22d3ee; font-weight: bold; }
        .brace-depth-3 { color: #c084fc; font-weight: bold; }

            <div class="flex-1 editor-container">
                <div id="editor-highlight" class="editor-layer code-font"></div>
                <textarea id="editor-textarea" class="editor-layer code-font focus:outline-none focus:border-gray-600" spellcheck="false">; === EFurokuScript: An interpreted language that supports diverse coding styles ===
@readvar_mode false

; --- 1. Generate an HTML element using JavaScript-style @dom object method ---
var myBtn = @dom.create("button").

; --- 2. Direct property assignment to update the DOM node ---
myBtn.text = "JS-Style Dynamic Button!".

myBtn.style = _"color", "#ffffff"_.
myBtn.style = _"border-radius", "30px"_.
myBtn.style = _"font-weight", "bold"_.

myBtn.style = _"cursor", "pointer"_.

; --- 3. Mount the element via object member execution ---
@dom.append("app-root", myBtn).

@out = "JS-style DOM Object Engine ready!".
</textarea>
            </div>
        </section>

        <!-- Console & Preview Right Pane -->
        <section class="w-full md:w-96 bg-gray-900 p-4 flex flex-col space-y-4 overflow-y-auto">
            <!-- Dynamic DOM App Mount Area -->

            <div class="flex flex-col h-48 bg-gray-950 p-4 rounded border border-gray-800 shadow-inner">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">🖥️ Live App Screen (#app-root)</h3>
                <div id="app-root" class="flex-1 flex items-center justify-center bg-gray-900 rounded border border-gray-800 p-2 overflow-auto"></div>
            </div>

            <!-- Console Output -->

            </div>

            <!-- Engine Data Monitor -->
            <div class="bg-gray-950 p-4 rounded border border-gray-800 space-y-3">

                <div>
                    <span class="text-xs text-gray-500 block">@readvar_mode:</span>
                    <span id="status-mode" class="text-sm font-mono font-bold text-gray-300">true</span>
                </div>
                <div>

                    <span class="text-xs text-gray-500 block mb-1">Variables:</span>
                    <div id="status-vars" class="text-xs font-mono max-h-32 overflow-y-auto space-y-1 bg-gray-900 p-2 rounded border border-gray-800"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Interpreter Core Pipeline Script -->
    <script>
        class ReturnOneSignal { constructor(value) { this.value = value; } }
        class ReturnZeroSignal { constructor(value) { this.value = value; } }
        class ReturnDescSignal { constructor(value) { this.value = value; } }

        // --- 1. Tokenizer ---
        function tokenize(source) {
            const tokens = [];
            let i = 0, lineNum = 1;
            while (i < source.length) {
                let ch = source[i];

                if (ch === '\n') { tokens.push({ type: 'NEWLINE', value: '\n', line: lineNum }); lineNum++; i++; continue; }
                if (/\s/.test(ch) && ch !== '\r') { i++; continue; }
                if (ch === '\r') { i++; continue; }
                if (ch === ';') { while (i < source.length && source[i] !== '\n') i++; continue; }
                if (ch === ':') { tokens.push({ type: 'COLON', value: ':', line: lineNum }); i++; continue; }
                if (ch === '[') { tokens.push({ type: 'LBRACKET', value: '[', line: lineNum }); i++; continue; }
                if (ch === ']') { tokens.push({ type: 'RBRACKET', value: ']', line: lineNum }); i++; continue; }
                if (ch === '_') { tokens.push({ type: 'UNDER_ARR', value: '_', line: lineNum }); i++; continue; }
                if (ch === '{') { tokens.push({ type: 'LBRACE', value: '{', line: lineNum }); i++; continue; }
                if (ch === '}') { tokens.push({ type: 'RBRACE', value: '}', line: lineNum }); i++; continue; }
                if (ch === '.') { tokens.push({ type: 'DOT', value: '.', line: lineNum }); i++; continue; }

                if (ch === '=') {
                    if (source.substring(i, i + 3) === '===') { tokens.push({ type: 'COMP', value: '===', line: lineNum }); i += 3; }
                    else if (source.substring(i, i + 2) === '==') { tokens.push({ type: 'COMP', value: '==', line: lineNum }); i += 2; }
                    else { tokens.push({ type: 'ASSIGN', value: '=', line: lineNum }); i++; }
                    continue;
                }
                if (ch === '<') {

                    if (source[i + 1] === '=') { tokens.push({ type: 'COMP', value: '<=', line: lineNum }); i += 2; }
                    else { tokens.push({ type: 'COMP', value: '<', line: lineNum }); i++; }
                    continue;
                }
                if (ch === '>') {
                    if (source[i + 1] === '=') { tokens.push({ type: 'COMP', value: '>=', line: lineNum }); i += 2; }
                    else { tokens.push({ type: 'COMP', value: '>', line: lineNum }); i++; }
                    continue;
                }
                if (ch === '$' && source[i + 1] === '=') { tokens.push({ type: 'COMP', value: '$=', line: lineNum }); i += 2; continue; }
                if (ch === '!') {
                    if (source.substring(i, i + 3) === '!==') { tokens.push({ type: 'COMP', value: '!==', line: lineNum }); i += 3; }
                    else if (source.substring(i, i + 2) === '!=') { tokens.push({ type: 'COMP', value: '!=', line: lineNum }); i += 2; }
                    else { tokens.push({ type: 'NOT', value: '!', line: lineNum }); i++; }
                    continue;
                }
                if (ch === '+') { tokens.push({ type: 'PLUS', value: '+', line: lineNum }); i++; continue; }
                if (ch === '-') { tokens.push({ type: 'MINUS', value: '-', line: lineNum }); i++; continue; }
                if (ch === '(') { tokens.push({ type: 'LPAREN', value: '(', line: lineNum }); i++; continue; }

                if (ch === ')') { tokens.push({ type: 'RPAREN', value: ')', line: lineNum }); i++; continue; }
                if (ch === ',') { tokens.push({ type: 'COMMA', value: ',', line: lineNum }); i++; continue; }

                if (ch === '"' || ch === "'") {
                    let quote = ch, start = i; i++;
                    while (i < source.length && source[i] !== quote) i++;
                    i++;
                    tokens.push({ type: 'STRING', value: source.substring(start + 1, i - 1), line: lineNum });
                    continue;
                }
                if (ch === '@') {
                    let start = i; i++;
                    while (i < source.length && /[a-zA-Z0-9_.]/.test(source[i])) i++;
                    let val = source.substring(start, i);
                    if (val === '@returns') tokens.push({ type: 'RETURN_KEYWORD', mode: 'one', value: val, line: lineNum });
                    else if (val === '@returnsdesc') tokens.push({ type: 'RETURN_KEYWORD', mode: 'desc', value: val, line: lineNum });
                    else if (val === '@returnszero') tokens.push({ type: 'RETURN_KEYWORD', mode: 'zero', value: val, line: lineNum });
                    else if (val === '@returnsvar') tokens.push({ type: 'RETURN_KEYWORD', mode: 'var', value: val, line: lineNum });
                    else tokens.push({ type: 'SYSTEM', value: val, line: lineNum });

                    continue;
                }
                if (/[a-zA-Z]/.test(ch)) {
                    let start = i; i++;
                    while (i < source.length && /[a-zA-Z0-9_.]/.test(source[i])) i++;
                    let val = source.substring(start, i);
                    if (val === 'var') tokens.push({ type: 'VAR', value: val, line: lineNum });
                    else if (val === 'const') tokens.push({ type: 'CONST', value: val, line: lineNum });
                    else if (val === 'readvar') tokens.push({ type: 'READVAR', value: val, line: lineNum });
                    else if (val === 'true' || val === 'false') tokens.push({ type: 'BOOLEAN', value: val, line: lineNum });
                    else if (val === 'if') tokens.push({ type: 'IF', value: val, line: lineNum });
                    else if (val === 'not') tokens.push({ type: 'NOT', value: val, line: lineNum });
                    else if (val === 'else') tokens.push({ type: 'ELSE', value: val, line: lineNum });
                    else if (val === 'elif' || val === 'elseif') tokens.push({ type: 'ELIF', value: val, line: lineNum });
                    else if (val === 'endif') tokens.push({ type: 'ENDIF', value: val, line: lineNum });
                    else if (val === 'for') tokens.push({ type: 'FOR', value: val, line: lineNum });
                    else if (val === 'lop') tokens.push({ type: 'LOP', value: val, line: lineNum });
                    else if (val === 'while') tokens.push({ type: 'WHILE', value: val, line: lineNum });
                    else if (val === 'endwhile' || val === 'endloop') tokens.push({ type: 'ENDLOOP', value: val, line: lineNum });

                    else if (['function', 'def', 'func', 'fn', 'define', 'named'].includes(val)) tokens.push({ type: 'FUNC_KEYWORD', value: val, line: lineNum });
                    else if (val === 'and') tokens.push({ type: 'AND_KEYWORD', value: val, line: lineNum });
                    else if (val === 'return') tokens.push({ type: 'RETURN_KEYWORD', mode: 'one', value: val, line: lineNum });
                    else if (val === 'end') {
                        let nextI = i;
                        while (nextI < source.length && /\s/.test(source[nextI]) && source[nextI] !== '\n') nextI++;
                        let sub = source.substring(nextI, nextI + 2);
                        let subL = source.substring(nextI, nextI + 4);
                        if (sub === 'if') { tokens.push({ type: 'ENDIF', value: 'end if', line: lineNum }); i = nextI + 2; }
                        else if (subL === 'loop') { tokens.push({ type: 'ENDLOOP', value: 'end loop', line: lineNum }); i = nextI + 4; }
                        else if (subL === 'while') { tokens.push({ type: 'ENDLOOP', value: 'end while', line: lineNum }); i = nextI + 5; }
                        else tokens.push({ type: 'IDENTIFIER', value: val, line: lineNum });
                    }
                    else tokens.push({ type: 'IDENTIFIER', value: val, line: lineNum });
                    continue;
                }
                if (/[0-9]/.test(ch)) {
                    let start = i; i++;
                    while (i < source.length && /[0-9]/.test(source[i])) i++;

                    tokens.push({ type: 'NUMBER', value: parseInt(source.substring(start, i), 10), line: lineNum });
                    continue;
                }
                i++;
            }
            return tokens;
        }

        // --- 1.5 Utility Argument Splitter (Moved Up to Fix Scope Dependencies) ---
        function splitArgs(tokens) {
            let args = [], current = [], pCount = 0, bCount = 0, oCount = 0;
            for (let i = 0; i < tokens.length; i++) {
                let t = tokens[i];
                if (t.type === 'LPAREN') pCount++; if (t.type === 'RPAREN') pCount--;
                if (t.type === 'LBRACKET') bCount++; if (t.type === 'RBRACKET') bCount--;
                if (t.type === 'LBRACE') oCount++; if (t.type === 'RBRACE') oCount--;
                if (pCount === 0 && bCount === 0 && oCount === 0) {
                    if (t.type === 'COMMA' || t.type === 'AND_KEYWORD') {
                        if (current.length > 0) { args.push(current); current = []; } continue;

                    }
                    if (current.length > 0) {
                        let last = current[current.length - 1];
                        if (['IDENTIFIER', 'NUMBER', 'BOOLEAN', 'STRING', 'RPAREN', 'RBRACKET', 'RBRACE'].includes(last.type) &&
                            ['IDENTIFIER', 'NUMBER', 'BOOLEAN', 'STRING', 'READVAR', 'LPAREN', 'LBRACKET', 'LBRACE', 'NOT', 'UNDER_ARR', 'SYSTEM'].includes(t.type)) {
                            args.push(current); current = [];
                        }
                    }
                }
                current.push(t);
            }
            if (current.length > 0) args.push(current); return args;
        }

        // --- 2. AST Parser ---
        function parseAST(tokens) {
            let idx = 0;
            function peek() { return tokens[idx]; }
            function next() { return tokens[idx++]; }


            function parseStatementsListExtended(closeTypesSet) {
                const list = [];
                while (idx < tokens.length) {
                    let tok = peek(); if (!tok) break;
                    if ((tok.type === 'RBRACE' || tok.type === 'RBRACKET' || tok.type === 'RPAREN') && (!closeTypesSet || !closeTypesSet.has(tok.type))) {
                        throw new Error(`[Line ${tok.line}] Syntax Error: Unexpected closing token tag '${tok.value}' found.`);
                    }
                    if (tok.type === 'NEWLINE' || tok.type === 'DOT') { next(); continue; }
                    if (closeTypesSet && closeTypesSet.has(tok.type)) {
                        if (tok.type === 'IF' && tokens[idx + 1] && tokens[idx + 1].type !== 'NOT') { list.push(parseIfStatement()); continue; }
                        break;
                    }
                    if (tok.type === 'IF' && tokens[idx + 1] && tokens[idx + 1].type === 'NOT') break;

                    if (tok.type === 'FUNC_KEYWORD') list.push(parseFunctionDeclaration());
                    else if (tok.type === 'IF') list.push(parseIfStatement());
                    else if (tok.type === 'WHILE') list.push(parseWhileStatement());
                    else if (['FOR', 'LOP'].includes(tok.type)) list.push(parseForOrLopStatement());
                    else list.push(parseFlatStatement());

                }
                return list;
            }

            function parseFunctionDeclaration() {
                while (idx < tokens.length && peek().type === 'FUNC_KEYWORD') next();
                let funcName = next().value; next();
                let argNames = [];
                while (idx < tokens.length && peek().type !== 'RPAREN') {
                    let t = next(); if (t.type === 'IDENTIFIER') argNames.push(t.value);
                }
                next();
                while (peek() && ['NEWLINE', 'DOT'].includes(peek().type)) next();
                next();
                let body = parseStatementsListExtended(new Set(['RBRACE'])); next();
                return { type: 'FUNC_DECL', name: funcName, args: argNames, body: body, line: tokens[idx-1].line };
            }

            function parseIfStatement() {

                let ifTok = next(), conditionTokens = [], elseIfBlocks = [], elseBlock = null, isBraceStyle = false, lookupIdx = idx;
                while (lookupIdx < tokens.length) {
                    let tok = tokens[lookupIdx];
                    if (tok.type === 'LBRACE') { isBraceStyle = true; break; }
                    if (tok.type === 'COMMA') { isBraceStyle = false; break; }
                    if (['IF', 'ENDIF', 'RBRACE', 'ELSE', 'ELIF', 'ENDLOOP'].includes(tok.type)) break;
                    lookupIdx++;
                }

                if (isBraceStyle) {
                    while (idx < tokens.length && peek().type !== 'LBRACE') conditionTokens.push(next());
                    next(); let mainBody = parseStatementsListExtended(new Set(['RBRACE'])); next();
                    while (idx < tokens.length) {
                        while (peek() && ['NEWLINE', 'DOT'].includes(peek().type)) next();
                        if (peek() && peek().type === 'ELSE') {
                            next();
                            while (peek() && ['NEWLINE', 'DOT'].includes(peek().type)) next();
                            if (peek() && peek().type === 'IF') {
                                next(); let elifCond = [];

                                while (idx < tokens.length && peek().type !== 'LBRACE') elifCond.push(next());
                                next(); let elifBody = parseStatementsListExtended(new Set(['RBRACE'])); next();
                                elseIfBlocks.push({ condition: elifCond, body: elifBody, line: peek() ? peek().line : ifTok.line, isBrace: true });
                            } else {
                                next(); elseBlock = parseStatementsListExtended(new Set(['RBRACE'])); next(); break;
                            }
                        } else break;
                    }
                    return { type: 'IF_STMT', condition: conditionTokens, body: mainBody, elseIfBlocks, elseBlock, isBrace: true, line: ifTok.line };
                } else {
                    while (idx < tokens.length && peek().type !== 'COMMA') conditionTokens.push(next());
                    next(); let closeSet = new Set(['ENDIF', 'ELSE', 'ELIF', 'ELSEIF', 'ENDLOOP']);
                    let mainBody = parseStatementsListExtended(closeSet);
                    while (idx < tokens.length) {
                        let tok = peek(); if (!tok) break;
                        if (['NEWLINE', 'DOT'].includes(tok.type)) { next(); continue; }
                        if (tok.type === 'ENDIF') { next(); break; }
                        if (tok.type === 'ELIF') {
                            let cl = tok.line; next(); let elifCond = [];

                            while (idx < tokens.length && peek().type !== 'COMMA') elifCond.push(next());
                            next(); let elifBody = parseStatementsListExtended(closeSet);
                            elseIfBlocks.push({ condition: elifCond, body: elifBody, line: cl, isBrace: false }); continue;
                        }
                        if (tok.type === 'ELSE') {
                            let cl = tok.line; next();
                            if (peek() && peek().type === 'IF') {
                                next(); let elifCond = [];
                                while (idx < tokens.length && peek().type !== 'COMMA') elifCond.push(next());
                                next(); let elifBody = parseStatementsListExtended(closeSet);
                                elseIfBlocks.push({ condition: elifCond, body: elifBody, line: cl, isBrace: false });
                            } else {
                                if (peek() && peek().type === 'COMMA') next();
                                elseBlock = parseStatementsListExtended(new Set(['ENDIF'])); next(); break;
                            }
                            continue;
                        }
                        break;
                    }

                    return { type: 'IF_STMT', condition: conditionTokens, body: mainBody, elseIfBlocks, elseBlock, isBrace: false, line: ifTok.line };
                }
            }

            function parseWhileStatement() {
                let startTok = next(), isInverted = false, conditionTokens = [], body = [], isBrace = false;
                let lookupIdx = idx, foundLBrace = false;
                while (lookupIdx < tokens.length) {
                    if (tokens[lookupIdx].type === 'LBRACE') { foundLBrace = true; break; }
                    if (['NEWLINE', 'COLON'].includes(tokens[lookupIdx].type)) break;
                    lookupIdx++;
                }
                if (peek() && peek().type === 'NOT') { next(); isInverted = true; }

                if (peek() && peek().type === 'LPAREN') {
                    next(); let pCount = 1; isBrace = true;
                    while (idx < tokens.length) {
                        let t = peek(); if (t.type === 'LPAREN') pCount++;
                        if (t.type === 'RPAREN') { pCount--; if (pCount === 0) { next(); break; } }

                        conditionTokens.push(next());
                    }
                    while (peek() && ['NEWLINE', 'DOT'].includes(peek().type)) next();
                    if (peek() && peek().type === 'LBRACE') next();
                    body = parseStatementsListExtended(new Set(['RBRACE'])); next();
                } else if (foundLBrace) {
                    isBrace = true;
                    while (idx < tokens.length && peek().type !== 'LBRACE') conditionTokens.push(next());
                    next(); body = parseStatementsListExtended(new Set(['RBRACE'])); next();
                } else {
                    while (idx < tokens.length && peek().type !== 'COLON' && peek().type !== 'NEWLINE') conditionTokens.push(next());
                    if (peek() && peek().type === 'COLON') next();
                    body = parseStatementsListExtended(new Set(['ENDLOOP'])); next();
                }
                if (isInverted) {
                    conditionTokens = [{ type: 'NOT', value: '!', line: startTok.line }, { type: 'LPAREN', value: '(', line: startTok.line }].concat(conditionTokens).concat([{ type: 'RPAREN', value: ')', line: startTok.line }]);
                }
                return { type: 'WHILE_STMT', condition: conditionTokens, body: body, isBrace: isBrace, line: startTok.line };
            }


            function parseForOrLopStatement() {
                let startTok = next(), lookupIdx = idx, foundLBrace = false;
                while (lookupIdx < tokens.length) {
                    if (tokens[lookupIdx].type === 'LBRACE') { foundLBrace = true; break; }
                    if (['NEWLINE', 'COLON'].includes(tokens[lookupIdx].type)) break;
                    lookupIdx++;
                }

                if (peek() && peek().type === 'LPAREN') {
                    next(); let innerTokens = [], pCount = 1;
                    while (idx < tokens.length) {
                        let t = peek(); if (t.type === 'LPAREN') pCount++;
                        if (t.type === 'RPAREN') { pCount--; if (pCount === 0) { next(); break; } }
                        innerTokens.push(next());
                    }
                    let groups = [[]];
                    innerTokens.forEach(t => { if (t.type === 'COMMA') groups.push([]); else groups[groups.length - 1].push(t); });
                    while (peek() && ['NEWLINE', 'DOT'].includes(peek().type)) next();
                    if (peek() && peek().type === 'LBRACE') next();

                    let body = parseStatementsListExtended(new Set(['RBRACE'])); next();
                    if (groups.length === 3) return { type: 'FOR_TRIPLE', initTokens: groups[0], condTokens: groups[1], afterTokens: groups[2], body: body, isBrace: true, line: startTok.line };
                    return { type: 'LOOP_COUNT', countTokens: groups[0], indexVar: groups[1] ? groups[1][0].value : null, body: body, isBrace: true, line: startTok.line };
                } else if (foundLBrace) {
                    let lineTokens = [];
                    while (idx < tokens.length && peek().type !== 'LBRACE') lineTokens.push(next());
                    next(); let body = parseStatementsListExtended(new Set(['RBRACE'])); next();
                    let compIdx = lineTokens.findIndex(t => t.type === 'COMP');
                    let assignIdx = lineTokens.findLastIndex(t => t.type === 'ASSIGN');
                    if (compIdx <= 0 || assignIdx <= compIdx) {
                        return { type: 'LOOP_COUNT', countTokens: [lineTokens[0]], indexVar: lineTokens[1] ? lineTokens[1].value : null, body: body, isBrace: true, line: startTok.line };
                    }
                    return { type: 'FOR_TRIPLE', initTokens: lineTokens.slice(0, compIdx - 1), condTokens: lineTokens.slice(compIdx - 1, assignIdx - 1), afterTokens: lineTokens.slice(assignIdx - 1), body: body, isBrace: true, line: startTok.line };
                } else {
                    let lineTokens = [];
                    while (idx < tokens.length && peek().type !== 'NEWLINE' && peek().type !== 'COLON') lineTokens.push(next());
                    let isColon = peek() && peek().type === 'COLON'; if (isColon) next();

                    statusVars.appendChild(div);

                });
            }
            if (res.success) {
                consoleOutput.textContent = res.outputs.length === 0 ? "(Completed with no output)" : res.outputs.join('\n');
            } else {
                const prev = res.outputs && res.outputs.length > 0 ? res.outputs.join('\n') + '\n' : "";
                consoleOutput.textContent = `${prev}❌ Execution Error:\n${res.error}`;
                consoleOutput.className = "flex-1 bg-red-950 p-3 rounded border border-red-800 code-font text-sm text-red-200 overflow-y-auto whitespace-pre-wrap shadow-inner";
            }
        }

        document.getElementById('btn-run').addEventListener('click', runCode);
        document.getElementById('btn-clear').addEventListener('click', () => { 
            editorTextarea.value = ""; applySyntaxHighlighting(); consoleOutput.textContent = "Cleared."; 
        });
        
        applySyntaxHighlighting();
        runCode();
    </script>
</body>
</html>
